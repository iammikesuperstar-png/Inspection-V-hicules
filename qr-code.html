<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code QR - Inspection de véhicule</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #f5faff 0%, #eef6ff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .qr-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 14px 28px rgba(10, 110, 209, 0.15);
        max-width: 500px;
        text-align: center;
      }

      .label {
        font-size: 24px;
        font-weight: 700;
        color: #d94d4d;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #qrCanvas {
        border: 3px solid #0a6ed1;
        border-radius: 12px;
        display: block;
        width: 100%;
        max-width: 400px;
        height: auto;
        margin: 0 auto 30px;
      }

      .button-group {
        display: flex;
        gap: 12px;
        flex-direction: column;
      }

      button {
        padding: 14px 20px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      .download-btn {
        background: linear-gradient(135deg, #0a6ed1 0%, #074a96 100%);
        color: white;
        box-shadow: 0 10px 22px rgba(10, 110, 209, 0.25);
      }

      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(10, 110, 209, 0.35);
      }

      .copy-btn {
        background: #e8f3ff;
        color: #074a96;
        border: 1px solid rgba(10, 110, 209, 0.2);
      }

      .copy-btn:hover {
        transform: translateY(-2px);
        background: #d4e8ff;
      }

      .info-text {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
        line-height: 1.6;
      }

      .link-display {
        margin-top: 20px;
        padding: 12px;
        background: #f0f0f0;
        border-radius: 8px;
        font-size: 12px;
        word-break: break-all;
        color: #333;
        font-family: monospace;
      }

      @media (max-width: 480px) {
        .qr-container {
          padding: 25px;
        }

        .label {
          font-size: 20px;
          margin-bottom: 20px;
        }

        button {
          font-size: 14px;
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="qr-container">
      <div class="label">⚠️ Obligatoire avant départ</div>
      <canvas id="qrCanvas"></canvas>

      <div class="button-group">
        <button class="download-btn" onclick="downloadQR()">📥 Télécharger le QR Code</button>
        <button class="copy-btn" onclick="copyLink()">📋 Copier le lien</button>
      </div>

      <div class="link-display" id="linkDisplay"></div>

      <div class="info-text">
        <p>Ce code QR dirige vers le formulaire d'inspection de véhicule avant départ.</p>
        <p>Scannez-le avec votre téléphone pour accéder à l'inspection.</p>
      </div>
    </div>

    <script>
      const inspectionUrl =
        'https://raw.githubusercontent.com/iammikesuperstar-png/Inspection-V-hicules/master/index.html';

      // Générer le QR code
      const canvas = document.getElementById('qrCanvas');
      QRCode.toCanvas(
        canvas,
        inspectionUrl,
        {
          width: 400,
          margin: 2,
          color: {
            dark: '#10263d',
            light: '#ffffff'
          }
        },
        function (error) {
          if (error) {
            console.error('Erreur lors de la génération du QR code:', error);
            alert('Erreur lors de la génération du QR code');
          }
        }
      );

      // Afficher le lien
      document.getElementById('linkDisplay').textContent = inspectionUrl;

      // Télécharger le QR code
      function downloadQR() {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'QR-Code-Inspection-Vehicule.png';
        link.click();
      }

      // Copier le lien
      function copyLink() {
        const text = inspectionUrl;
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = '✅ Copié!';
          setTimeout(() => {
            btn.textContent = originalText;
          }, 2000);
        });
      }
    </script>
  </body>
</html>
