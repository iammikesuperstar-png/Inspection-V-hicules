<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code QR - Inspection de véhicule</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #f5faff 0%, #eef6ff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .qr-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 14px 28px rgba(10, 110, 209, 0.15);
        max-width: 500px;
        text-align: center;
      }

      .label {
        font-size: 28px;
        font-weight: 700;
        color: #d94d4d;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .qr-box {
        border: 4px solid #0a6ed1;
        border-radius: 16px;
        padding: 20px;
        background: #f9f9f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 380px;
      }

      .qr-box img {
        display: block;
        width: 100%;
        max-width: 350px;
        height: auto;
      }

      .info-text {
        margin-top: 30px;
        font-size: 14px;
        color: #666;
        line-height: 1.6;
      }

      @media (max-width: 480px) {
        .qr-container {
          padding: 25px;
        }

        .label {
          font-size: 22px;
          margin-bottom: 20px;
        }

        .qr-box {
          padding: 15px;
          min-height: 300px;
        }
      }

      @media print {
        body {
          background: none;
          padding: 0;
        }

        .qr-container {
          box-shadow: none;
          padding: 30px;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="qr-container">
      <div class="label">⚠️ OBLIGATOIRE AVANT DÉPART</div>
      
      <div class="qr-box">
        <img id="qrImage" src="" alt="Code QR d'inspection de véhicule" />
      </div>

      <div class="info-text">
        <p><strong>Scannez ce code QR avec votre téléphone</strong></p>
        <p>pour accéder au formulaire d'inspection de véhicule avant départ.</p>
      </div>
    </div>

    <script>
      const inspectionUrl = 'https://iammikesuperstar-png.github.io/Inspection-V-hicules/';
      const qrImage = document.getElementById('qrImage');
      
      // Générer le QR code via QR Server API
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(inspectionUrl)}`;
      qrImage.src = qrApiUrl;
    </script>
  </body>
</html>
